dataset: gowalla
inherit: base.yaml
# Laptop/CPU profile (8 GB RAM). Restore base.yaml model sizes on Colab/GPU.
model:
  poi_dim: 32
  hour_dim: 8
  hidden: 64
  seq_len: 10
  lr: 0.001
  batch_size: 32
  max_epochs: 6
  patience: 3
  windows_per_user_cap: 12
  dp_epochs: 4
  max_grad_norm: 1.0
attacks:
  reid_n_targets: 40
  reid_d_m: 250
  reid_dt_hours: 1
  reid_p: [2, 4, 8]
  mia_tpr_fpr: 0.01
  mia_max_users: 80
fl:
  clients_per_round: 8
  local_epochs: 1
  rounds: 5
  clip_norm: 1.0
  lr: 0.01
# Austin, TX — historically the densest Gowalla metro, comparable in scale to NYC.
bbox:
  lat_min: 30.12
  lat_max: 30.52
  lon_min: -97.95
  lon_max: -97.55
download:
  urls:
    - https://snap.stanford.edu/data/loc-gowalla_totalCheckins.txt.gz
